<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let n = parseInt(prompt("Podaj liczbę n:"));

    if (isNaN(n) || n <= 0) {
        document.write("Proszę podać dodatnią liczbę całkowitą.");
    } else {
        let i = 1;
        let suma = 0;

        while (i <= n) {
            suma += i;

            document.write("Suma liczb od 1 do " + i + " wynosi: " + suma + "<br>");

            i++;
        }
    }
</script>
</body>
</html>
