<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let a = parseInt(prompt('Podaj dodatnią liczbę całkowitą:'))
    if (isNaN(a) || a <= 0) {
        document.write('Proszę podać dodatnią liczbę całkowitą.')
    } else {
        for (let i = 1; i <= a; i++) {
            document.write('Kwadrat liczby ' + i + ' to: ' + (i * i) + "<br>");
        }
    }
</script>
</body>
</html>
