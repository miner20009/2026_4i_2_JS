<meta charset="UTF-8">
<title>Tytuł</title>
</head>
<body>
<script>
  let n = parseInt(prompt("podaj n:"));
  for(let i=1;i<=n;i++){
    for(let j=1;j<=n;j++){
      if(i%2==0){
        document.write("1")
      }
      else{
        document.write("0")
      }
    }
    document.write("<br>")
  }
</script>
</body>
