<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Demo - pole trapezu</title>
</head>
<body>
<script>
    let a = parseFloat(prompt('Podaj a: ', ''))
    let b = parseFloat(prompt('Podaj b: ', ''))
    let h = parseFloat(prompt('Podaj h: ', ''))

    let wynik = (a + b) / 2 * h

    document.write('a = ' + a + '<br>')
    document.write('b = ' + b + '<br>')
    document.write('h = ' + h + '<br>')
    document.write('pole = ' + wynik.toFixed(2))
</script>
</body>
</html>
