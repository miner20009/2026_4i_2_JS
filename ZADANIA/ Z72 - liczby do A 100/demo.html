
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie Z72</title>
</head>
<body>
<script>
    let a = parseInt(prompt('Podaj liczbę całkowitą A:'));
    if (isNaN(a) || a <= 0) {
        document.write('Podaj dodatnią liczbę całkowitą.');
    } else {
        if (a >= 100) {
            a = 100;
        }
        for (let i = 1; i <= a; i++) {
            document.write( i );
            if (i < a) {
                document.write(';');
            }
        }
    }
</script>
</body>
</html>
