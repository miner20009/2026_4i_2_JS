<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Demo - kwadrat i sześcian</title>
</head>
<body>
<script>
    let liczba = parseInt(prompt('Podaj liczbę: ', ''))
    let kwadrat = liczba * liczba
    let szescian = liczba * liczba * liczba

    document.write('liczba = ' + liczba + '<br>')
    document.write('kwadrat = ' + kwadrat + '<br>')
    document.write('sześcian = ' + szescian + '<br>')
</script>
</body>
</html>
