<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let a = prompt('Podaj a','')
    let b = prompt('Podaj b','')
    a = parseFloat(a)
    b = parseFloat(b)
    let iloraz = a/b

    document.write('a = '+a+'<br>')
    document.write('b = '+b+'<br>')
    document.write('iloraz ='+iloraz+'<br>')
    document.write('iloraz liczb ='+iloraz.toFixed(2))
</script>
</body>
</html>
