<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let wartosc = parseFloat(prompt('Podaj wartość: ', ''))
    let procent = parseFloat(prompt('Podaj procenty: ', ''))

    let wynik = wartosc * procent / 100

    document.write('wartosc = ' + wartosc + '<br>')
    document.write('procent = ' + wynik + '<br>')
</script>
</body>
</html>
