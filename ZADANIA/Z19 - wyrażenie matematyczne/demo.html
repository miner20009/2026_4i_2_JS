<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie Z19</title>
</head>
<body>
<script>
    let x = parseFloat(prompt('Podaj wartość x: ', ''))
    let wynik = x * x / Math.pow(1 + Math.abs(x), 2)

    document.write('x = ' + x + '<br>')
    document.write('wynik = ' + wynik)
</script>
</body>
</html>
