<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie Z74</title>
</head>
<body>
<script>
    let N = parseInt(prompt('Podaj dodatnią liczbę całkowitą N:'));
    if (isNaN(N) || N <= 0) {
        document.write('Podano nieprawidłową liczbę!');
    } else {
        for (let i = 1; i <= N; i++) {
            let ulamek = 1 / i;

            document.write('Piętro ' + i + ' ');

            for (let j = 1; j <= i; j++) {
                document.write('>');
            }

            document.write(' ' + '1/' + i + ' - ' + ulamek.toFixed(6) + '<br>');
        }
        document.write('> > > > Koniec wspinaczki wracamy < < < < <br>');
        for (let i = N; i >= 1; i--) {
            document.write('Piętro ' + i + ' ');

            for (let j = 1; j <= i; j++) {
                document.write('>');
            }

            document.write('<br>');
        }
    }
</script>
</body>
</html>
