<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let x1 = parseFloat(prompt('Podaj wartość x1',''))
    let y1 = parseFloat(prompt('Podaj wartość y1',''))
    let x2 = parseFloat(prompt('Podaj wartość x2',''))
    let y2 = parseFloat(prompt('Podaj wartość y2',''))
    let x3 = parseFloat(prompt('Podaj wartość x3',''))
    let y3 = parseFloat(prompt('Podaj wartość y3',''))

    let pole = Math.abs(0.5 * ((x1 * y1 - x2 * y2) + (x2 * y3 - x3 * y2) + (x3 * y1 - x1 * y3)))
    if (pole == 0) {
        document.write('Podano błędne dane')
    }
    else
    {
        document.write('x1 = '+ x1 +'<br>')
        document.write('y1 = '+ y1 +'<br>')
        document.write('x2 = '+ x2 +'<br>')
        document.write('y2 = '+ y2 +'<br>')
        document.write('x3 = '+ x3 +'<br>')
        document.write('y3 = '+ y3 +'<br>')
        document.write('Pole wynosi:' + pole)
    }

</script>
</body>
</html>
