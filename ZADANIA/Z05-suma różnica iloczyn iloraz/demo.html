<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let a = parseInt(prompt('Podaj liczbe a:',''))
    let b = parseInt(prompt('Podaj liczbe b:',''))

    let suma = a + b
    let roznica = a - b
    let iloczyn = a * b
    let iloraz = a / b
    let iloraz_calkowity = Math.floor(a / b)
    let reszta = a % b
    let potega = a ** b

    document.write('a = ' + a + '<br>')
    document.write('b = ' + b + '<br>')
    document.write('suma = ' + suma + '<br>')
    document.write('różnica = ' +  roznica + '<br>')
    document.write('iloczyn = ' + iloczyn + '<br>')
    document.write('iloraz = ' + iloraz + '<br>')
    document.write('iloraz_calkowity = ' + iloraz_calkowity + '<br>')
    document.write('reszta = ' + reszta + '<br>')
    document.write('potęga = ' + potega + '<br>')

</script>
</body>
</html>
