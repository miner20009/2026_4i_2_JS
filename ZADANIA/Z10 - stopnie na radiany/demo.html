<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let stopnie = parseFloat(prompt('Podaj ilość stopnii: ',''))
    let radian = stopnie * Math.PI / 180
    document.write('stopnie = '+ stopnie + '<br>')
    document.write('radian = '+ radian + '<br>')
</script>
</body>
</html>
