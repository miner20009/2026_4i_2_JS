<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let a = parseInt(prompt('Podaj liczbe a:',''))
    let b = parseInt(prompt('Podaj liczbe b:',''))

    if (b == 0 ) {
      document.write('Nie dzielimy przez 0')
    }
    else
    {
        document.write('a = ' + a + '<br>')
        document.write('b = ' + b + '<br>')
        let iloraz = a / b;
        document.write('iloraz liczb a i b: ' + iloraz + '<br>')
    }
</script>

</body>
</html>
