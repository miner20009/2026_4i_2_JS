<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Demo Z22</title>
</head>
<body>
<script>
    let a = parseFloat(prompt('Podaj A: ', ''))
    let b = parseFloat(prompt('Podaj B: ', ''))

    let c = Math.sqrt(a * a + b * b)

    document.write('A = ' + a + '<br>')
    document.write('B = ' + b + '<br>')
    document.write('C = ' + c)
</script>
</body>
</html>
