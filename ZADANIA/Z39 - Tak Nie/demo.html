<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let znak = prompt('Podaj znak:','')
    if (znak == 'T' || znak == 't') {
        document.writeln('TAK')
    } else {
        if (znak == 'N' || znak == 'n') {
            document.writeln('NIE')
        }
    }
</script>
</body>
</html>
