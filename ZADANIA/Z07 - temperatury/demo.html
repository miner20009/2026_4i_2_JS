<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let celciusz = parseFloat(prompt('Podaj stopnie Celciusza: ', ''))
    let kelwin = celciusz + 273.15
    let fahrenheit = celciusz * 1.8 + 32
    document.write('celciusz: ' + celciusz + '<br>')
    document.write('kelwin: ' + kelwin + '<br>')
    document.write('fahrenheit: ' + fahrenheit + '<br>')
</script>
</body>
</html>
