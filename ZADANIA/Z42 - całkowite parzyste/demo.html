<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let a = parseInt(prompt('Podaj a:',''))
    let b = parseInt(prompt('Podaj b:',''))

    if (isNaN(a) || isNaN(b)) {
        document.writeln('Podana wartość lub wartości nie są liczbami')
    } else if (a % 2 != 0 || b % 2 != 0) {
        document.writeln('Podana liczba lub liczby są nieparzyste')
    } else if (a == b) {
        document.writeln('Liczby są równe')
    } else if (a > b) {
        document.writeln('Wieksza liczba to:' + a)
    } else {
        document.writeln('Większa liczba to:' + b)
    }
</script>
</body>
</html>
