<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie Z73</title>
</head>
<body>
<script>
    let a = parseInt(prompt('Podaj liczbę całkowitą A:'))
            for (let i = 2; i <= a; i += 2) {
            document.write(i)
            if (i + 2 <= a) {
                document.write(';')
            }
    }
</script>
</body>
</html>
