<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zadanie Z27 - odległość 3 punkty</title>
</head>
<body>
<script>
  let x1 = parseFloat(prompt('Podaj x1: ', '0'))
  let y1 = parseFloat(prompt('Podaj y1: ', '0'))
  let x2 = parseFloat(prompt('Podaj x2: ', '1'))
  let y2 = parseFloat(prompt('Podaj y2: ', '1'))
  let x3 = parseFloat(prompt('Podaj x3: ', '2'))
  let y3 = parseFloat(prompt('Podaj y3: ', '2'))

  let d12 = Math.sqrt((x1 - x2) ** 2 + (y1 - y2) ** 2)
  let d13 = Math.sqrt((x1 - x3) ** 2 + (y1 - y3) ** 2)
  let d23 = Math.sqrt((x2 - x3) ** 2 + (y2 - y3) ** 2)

  document.write('P1 = (' + x1 + ', ' + y1 + ')<br>')
  document.write('P2 = (' + x2 + ', ' + y2 + ')<br>')
  document.write('P3 = (' + x3 + ', ' + y3 + ')<br><br>')

  document.write('Odległość P1-P2 = ' + d12 + '<br>')
  document.write('Odległość P1-P3 = ' + d13 + '<br>')
  document.write('Odległość P2-P3 = ' + d23 + '<br>')
</script>
</body>
</html>
