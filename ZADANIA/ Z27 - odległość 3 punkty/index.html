<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie Z27 - odległość 3 punkty</title>

</head>
<body>
<header>
    <h1>Zadanie Z27 - odległość 3 punkty</h1>
    <h2>Autor: Dominik Meyer</h2>
    <hr>
</header>
<main>
    <section>
        <p>
            Napisz program, który dla danych współrzędnych trzech punktów
            (x1, y1), (x2, y2), (x3, y3) oblicza odległości między tymi punktami.
        </p>

        <p>
            Wzór:
            d = √((x1 - x2)² + (y1 - y2)²)
        </p>

        <label for="x1">x1:</label>
        <input type="number" id="x1" value="0" step="any">

        <label for="y1">y1:</label>
        <input type="number" id="y1" value="0" step="any">

        <label for="x2">x2:</label>
        <input type="number" id="x2" value="1" step="any">

        <label for="y2">y2:</label>
        <input type="number" id="y2" value="1" step="any">

        <label for="x3">x3:</label>
        <input type="number" id="x3" value="2" step="any">

        <label for="y3">y3:</label>
        <input type="number" id="y3" value="2" step="any">

        <button>Wykonaj i wyświetl</button>
    </section>
    <section class="wynik">
        ..............
    </section>
</main>
<script src="main.js"></script>
</body>
</html>
