<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let a = prompt('Podaj a','')
    let b = prompt('Podaj b','')
    let c = prompt('Podaj c','')
    let d = prompt('Podaj d','')
    a = parseFloat(a)
    b = parseFloat(b)
    c = parseFloat(c)
    d = parseFloat(d)
    let suma = a+b+c+d
    let srednia = suma / 4

    document.write('a = '+a+'<br>')
    document.write('b = '+b+'<br>')
    document.write('c = '+c+'<br>')
    document.write('d = '+d+'<br>')
    document.write('suma = '+suma+'<br>')
    document.write('średnia ='+srednia+'<br>')
    document.write('średnia zaokrąglona ='+srednia.toFixed(3))
</script>
</body>
</html>
